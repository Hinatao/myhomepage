<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリ起動ページ</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #d9534f;
            margin-top: 0;
        }
        /* 画像をしっかり見やすい大きさに調整 */
        .notice-img {
            width: 100%;
            max-width: 350px; /* 見やすいサイズに大きくしました */
            height: auto;
            border-radius: 8px;
            border: 2px solid #ddd;
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }
        /* アプリを開くための大きなボタン */
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: #fff;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .sub-text {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚠️ ページの開き方</h2>
        <p>
            もし下の画像のような<strong>「Zzzz (スリープ画面)」</strong>が出てきたら、<br>
            <strong>青いボタン</strong>を押して数秒お待ちください。
        </p>

        <!-- 見やすい大きさに調整した画像 -->
        <img src="index.jpg" alt="スリープ状態の画面" class="notice-img">

        <div>
            <!-- アプリを直接開くボタン（確実に起動できます） -->
            <a href="https://myhomepage-f5qgd5w7aqpnlm4cxfcwig.streamlit.app/" target="_blank" class="btn">
                ホームページを見る👀
            </a>
        </div>

        <div class="sub-text">
            ※ボタンを押すと、新しいタブでアプリが起動します。
        </div>
    </div>

</body>
</html>
